<div id="root"></div><div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden"></div>
<script>
const API="/api"; let token=null; let me=null;
const state={role:"farmer",screen:"login",centres:[],slots:[],bookings:[],selectedCentre:null,selectedDate:new Date().toISOString().slice(0,10),selectedSlot:null,crop:"Paddy",qty:20,paymentMethod:"UPI",currentRate:null,language:"en"};
const $=s=>document.querySelector(s);
async function api(path,opts={}){const headers={"Content-Type":"application/json",...(opts.headers||{})};if(token)headers.Authorization="Bearer "+token;const r=await fetch(API+path,{...opts,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Request failed");return d}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hidden"),2800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function statusPill(s){let c=s==="BOOKED"?"":" "+(s==="CHECKED_IN"||s==="IN_PROGRESS"?"progress":s==="CANCELLED"?"red":s==="COMPLETED"?"":"wait");return `<span class="pill${c}">${esc(farmerStatus(s))}</span>`}
function logout(){token=null;localStorage.removeItem("kd_token");localStorage.removeItem("kd_language");me=null;state.role="farmer";state.screen="login";render()}
async function init(){
  token=null; me=null; state.role="farmer"; state.screen="login"; state.language="en"; render();
}
async function loadRole(){
  state.role="farmer"; state.screen="farmer";
  await Promise.all([loadCentres(),loadBookings()]);
  render();
}
async function login(){
  const phone=document.getElementById("loginPhone")?.value.trim();
  const password=document.getElementById("loginPassword")?.value;
  const err=document.getElementById("loginError");
  if(!phone || !/^\d{10}$/.test(phone)){if(err)err.textContent="Enter a valid 10-digit mobile number.";return;}
  if(!password){if(err)err.textContent="Enter your password.";return;}
  try{
    const r=await api("/auth/login",{method:"POST",body:JSON.stringify({phone,password})});
    token=r.token; localStorage.removeItem("kd_token"); me=r.user; state.role="farmer";
    state.language=r.user.language||"en"; state.screen="language"; render();
  }catch(e){if(err)err.textContent=e.message;}
}
function showRegister(){state.screen="register";render()}
function showLogin(){state.screen="login";render()}
async function registerFarmer(){
  const name=document.getElementById("regName")?.value.trim();
  const phone=document.getElementById("regPhone")?.value.trim();
  const password=document.getElementById("regPassword")?.value;
  const confirm=document.getElementById("regConfirm")?.value;
  const district=document.getElementById("regDistrict")?.value.trim();
  const err=document.getElementById("registerError");
  if(!name){err.textContent="Enter your full name.";return}
  if(!/^\d{10}$/.test(phone||"")){err.textContent="Enter a valid 10-digit mobile number.";return}
  if(!password || password.length<4){err.textContent="Password must be at least 4 characters.";return}
  if(password!==confirm){err.textContent="Passwords do not match.";return}
  try{
    const r=await api("/auth/register",{method:"POST",body:JSON.stringify({name,phone,password,district})});
    token=null;me=null;state.role="farmer";state.screen="login";render();toast("Farmer account created successfully. Please sign in with your new account.");
  }catch(e){err.textContent=e.message}
}
function loginView(){
  return `<div class="login"><div class="loginbox">
    <div class="brand">🌾 KisanDwaar</div>
    <div class="alert" style="margin-top:16px;background:#f1faf5;border-color:#cfe6d8"><b>Farmer Portal</b><br><span class="muted">Book procurement slots, pay the booking fee, track your queue and manage your reservations.</span></div>
    <h2 style="margin-bottom:6px">Farmer sign in</h2>
    <p class="muted" style="margin-top:0">Use your registered mobile number and password.</p>
    <div class="field"><label>Mobile number</label><input id="loginPhone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></div>
    <div class="field" style="margin-top:12px"><label>Password</label><input id="loginPassword" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()"></div>
    <div id="loginError" class="error" style="min-height:18px;margin-top:8px"></div>
    <button class="btn primary" style="width:100%;margin-top:6px" onclick="login()">Sign in to Farmer Portal</button>
    <button class="btn" style="width:100%;margin-top:8px" onclick="showRegister()">Create new farmer account</button>
    <div class="alert" style="margin-top:16px"><b>Employee Portal</b><br><span class="muted">Coming soon. The current release is for farmers only.</span></div>
  </div></div>`;
}
function registerView(){
  return `<div class="login"><div class="loginbox">
    <div class="brand">🌾 KisanDwaar</div><h2>Create farmer account</h2>
    <p class="muted">Register once, then use your mobile number and password for future logins.</p>
    <div class="field"><label>Full name</label><input id="regName" placeholder="e.g. Ramesh Yadav"></div>
    <div class="field" style="margin-top:12px"><label>Mobile number</label><input id="regPhone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></div>
    <div class="field" style="margin-top:12px"><label>District</label><input id="regDistrict" placeholder="e.g. Sangareddy"></div>
    <div class="field" style="margin-top:12px"><label>Password</label><input id="regPassword" type="password" placeholder="At least 4 characters"></div>
    <div class="field" style="margin-top:12px"><label>Confirm password</label><input id="regConfirm" type="password" placeholder="Re-enter password"></div>
    <div id="registerError" class="error" style="min-height:18px;margin-top:8px"></div>
    <button class="btn primary" style="width:100%;margin-top:6px" onclick="registerFarmer()">Create account</button>
    <button class="btn" style="width:100%;margin-top:8px" onclick="showLogin()">Back to sign in</button>
  </div></div>`;
}

 hi:{hello:'नमस्ते',farmerDashboard:'किसान डैशबोर्ड',farmerSub:'अपनी खरीद स्लॉट बुक और ट्रैक करें',manage:'अपने आरक्षण प्रबंधित करें और लाइव कतार अपडेट देखें।',bookAnother:'+ एक और स्लॉट बुक करें',myBookings:'मेरी बुकिंग',nearby:'नजदीकी खरीद केंद्र',open:'खुला',bookSlot:'स्लॉट बुक करें',noBookings:'अभी कोई बुकिंग नहीं है।',bookFirst:'अपना पहला स्लॉट बुक करें',bookingId:'बुकिंग ID',token:'टोकन',onTime:'समय पर',delayed:'देरी',estimatedWait:'अनुमानित प्रतीक्षा',ahead:'आगे',view:'देखें',cancel:'बुकिंग रद्द करें',details:'बुकिंग विवरण',close:'बंद करें',centre:'केंद्र',date:'तारीख',slot:'स्लॉट',time:'समय',cropQty:'फसल / मात्रा',dailyRate:'दैनिक दर',finalAmount:'अंतिम राशि',calculated:'तौल के बाद गणना होगी',payment:'भुगतान',delay:'देरी',notSet:'सेट नहीं है',bookSlotTitle:'स्लॉट बुक करें',feeApplies:'हर आरक्षण पर ₹20 बुकिंग शुल्क लागू है।',back:'वापस',procurementCentre:'खरीद केंद्र',crop:'फसल',quantity:'मात्रा (क्विंटल)',govRate:'सरकारी खरीद दर',perQuintal:'/ क्विंटल',rateNotSet:'दर अभी सेट नहीं है',estimatedValue:'अनुमानित मूल्य = दर × वजन। अंतिम राशि कर्मचारी द्वारा दर्ज अंतिम खरीद वजन से निकाली जाएगी।',availableSlots:'उपलब्ध समय स्लॉट',remaining:'क्विंटल शेष',noSlots:'इस तारीख के लिए कोई स्लॉट उपलब्ध नहीं है।',bookingFee:'बुकिंग शुल्क',payAfter:'सर्वर द्वारा स्लॉट आरक्षित करने के बाद ही भुगतान करें।',reviewPayment:'समीक्षा और भुगतान',demoPayment:'डेमो भुगतान — कोई वास्तविक पैसा नहीं लिया जाएगा।',paymentMethod:'भुगतान विधि',payConfirm:'₹20 भुगतान करें और बुकिंग पक्की करें',bookingCancelled:'बुकिंग सफलतापूर्वक रद्द हुई',bookingConfirmed:'₹20 भुगतान हुआ — स्लॉट पक्का हुआ',minutes:'मि.',delayWord:'देरी',statuses:{BOOKED:'बुक हुआ',CHECKED_IN:'गेट एंट्री',IN_PROGRESS:'प्रगति में',CANCELLED:'रद्द',COMPLETED:'पूरा हुआ'},crops:{Paddy:'धान',Wheat:'गेहूं',Maize:'मक्का',Cotton:'कपास'},logout:'लॉग आउट',language:'भाषा',english:'English',telugu:'తెలుగు',hindi:'हिंदी',changeLanguage:'भाषा बदलें'}

function t(k){return (I18N[state.language]||I18N.en)[k]||I18N.en[k]||k}
function farmerStatus(s){if(state.role==='farmer')return (I18N[state.language]||I18N.en).statuses?.[s]||s.replaceAll('_',' ');return s.replaceAll('_',' ')}
function farmerCrop(c){if(state.role==='farmer')return (I18N[state.language]||I18N.en).crops?.[c]||c;return c}
function locale(){return state.language==='te'?'te-IN':state.language==='hi'?'hi-IN':'en-IN'}
function setFarmerLanguage(v){state.language=v;localStorage.setItem('kd_language',v);api('/me',{method:'PATCH',body:JSON.stringify({language:v})}).catch(()=>{}).finally(()=>render())}
function langSelect(){return `<select aria-label="${t('language')}" onchange="setFarmerLanguage(this.value)" style="padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff"><option value="en" ${state.language==='en'?'selected':''}>${t('english')}</option><option value="te" ${state.language==='te'?'selected':''}>${t('telugu')}</option><option value="hi" ${state.language==='hi'?'selected':''}>${t('hindi')}</option></select>`}

async function loadCentres(){state.centres=await api("/centres")}
async function loadBookings(){state.bookings=await api("/farmer/bookings")}
async function loadSlots(){if(!state.selectedCentre)return;state.slots=await api(`/slots?centre_id=${state.selectedCentre}&date=${state.selectedDate}`)}
async function currentRate(){if(!state.selectedCentre)return null;const rs=await api(`/rates?centre_id=${state.selectedCentre}&date=${state.selectedDate}&crop=${encodeURIComponent(state.crop)}`);return rs[0]||null}
function farmerLayout(content){return `<div class="app"><div class="topbar"><div class="brand">🌾 KisanDwaar</div><div><div class="top-title">${t('farmerDashboard')}</div><div class="top-sub">${t('farmerSub')}</div></div><div class="spacer"></div><div class="user-chip"><div><b>${esc(me?.name||'Farmer')}</b><div class="top-sub">${esc(me?.phone||'')}</div></div><div class="avatar">${esc((me?.name||'F').slice(0,1))}</div>${langSelect()}<button class="btn small" onclick="logout()">${t('logout')}</button></div></div>${content}</div>`}
function farmerHome(){return farmerLayout(`<div class="farmer-shell"><div class="farmer-head"><div><h2 style="margin:0">${t('hello')}, ${esc(me.name)} 👋</h2><div class="muted">${t('manage')}</div></div><button class="btn primary" onclick="startBooking()">${t('bookAnother')}</button></div><div class="farmer-grid"><div class="card"><h3>${t('myBookings')} (${state.bookings.length})</h3>${state.bookings.length?state.bookings.map(b=>bookingCard(b)).join(""):`<div class="empty">${t('noBookings')}<br><br><button class="btn primary" onclick="startBooking()">${t('bookFirst')}</button></div>`}</div><div class="card"><h3>${t('nearby')}</h3>${state.centres.map(c=>`<div class="booking-card"><div class="booking-top"><div><div class="booking-name">${esc(c.name)}</div><div class="meta">${esc(c.location)} · ${c.distance_km} km</div></div><span class="pill">${t('open')}</span></div><button class="btn primary small" style="margin-top:10px" onclick="startBooking('${c.id}')">${t('bookSlot')}</button></div>`).join("")}</div></div></div>`)}
function bookingCard(b){const delay=b.delay_minutes||0;return `<div class="booking-card"><div class="booking-top"><div><div class="booking-name">${esc(b.centre_name)}</div><div class="meta">${t('bookingId')}: ${esc(b.id)} · ${t('token')} ${esc(b.token_number)}</div></div>${statusPill(b.status)}</div><div style="margin-top:8px"><b>${esc(new Date(b.booking_date+"T00:00:00").toLocaleDateString(locale(),{weekday:"short",day:"2-digit",month:"short"}))}</b> · ${esc(b.slot_start)} – ${esc(b.slot_end)}</div><div class="meta">${delay?`⏱ ${t('delayed')} ${delay} ${t('minutes')}`:`✓ ${t('onTime')}`} ${b.eta_minutes!=null?`· ${t('estimatedWait')} ${b.eta_minutes} min · ${b.tokens_ahead} ${t('ahead')}`:""}</div><div class="actions" style="margin-top:10px"><button class="btn primary small" onclick="viewBooking('${b.id}')">${t('view')}</button>${b.status==="BOOKED"?`<button class="btn danger small" onclick="cancelBooking('${b.id}')">${t('cancel')}</button>`:""}</div></div>`}
async function viewBooking(id){try{const b=await api(`/bookings/${id}`);$("#modal").innerHTML=`<div class="modalbox"><div class="booking-top"><h2 style="margin:0">${t('details')}</h2>${statusPill(b.status)}</div><div class="detailgrid" style="margin-top:16px"><div class="kv"><small>${t('centre')}</small><b>${esc(b.centre_name)}</b></div><div class="kv"><small>${t('token')}</small><b>${esc(b.token_number)}</b></div><div class="kv"><small>${t('date')}</small><b>${esc(b.booking_date)}</b></div><div class="kv"><small>${t('slot')}</small><b>${esc(b.slot_start)} – ${esc(b.slot_end)}</b></div><div class="kv"><small>${t('cropQty')}</small><b>${esc(farmerCrop(b.crop))} / ${b.declared_quantity} qtl</b></div><div class="kv"><small>${t('dailyRate')}</small><b>${b.rate!=null?money(b.rate)+' / qtl':t('notSet')}</b></div><div class="kv"><small>${t('finalAmount')}</small><b>${b.total_amount!=null?money(b.total_amount):t('calculated')}</b></div><div class="kv"><small>${t('payment')}</small><b>${money(b.payment?.amount||20)} · ${esc(b.payment_status)}</b></div><div class="kv"><small>${t('delay')}</small><b>${b.delay_minutes?`${t('delayed')} ${b.delay_minutes} min`:t('onTime')}</b></div><div class="kv"><small>${t('estimatedWait')}</small><b>${b.eta_minutes!=null?b.eta_minutes+' min':'—'}</b></div></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="closeModal()">${t('close')}</button>${b.status==="BOOKED"?`<button class="btn danger" onclick="closeModal();cancelBooking('${b.id}')">${t('cancel')}</button>`:""}</div></div>`;$("#modal").classList.remove("hidden")}catch(e){toast(e.message)}}
function closeModal(){$("#modal").classList.add("hidden")}
async function cancelBooking(id){const reason=prompt(state.language==='te'?'ఎందుకు రద్దు చేస్తున్నారు?':state.language==='hi'?'रद्द करने का कारण क्या है?':'Why are you cancelling?',state.language==='te'?'ప్రణాళిక మారింది':state.language==='hi'?'योजना बदल गई':'Change of plan');if(!reason)return;try{await api(`/bookings/${id}/cancel`,{method:'POST',body:JSON.stringify({reason})});await loadBookings();render();toast(t('bookingCancelled'))}catch(e){toast(e.message)}}
async function startBooking(cid){state.selectedCentre=cid||state.centres[0]?.id;state.selectedDate=new Date().toISOString().slice(0,10);state.selectedSlot=null;state.screen='book';await loadSlots();state.currentRate=await currentRate();render()}
function bookingView(){return farmerLayout(`<div class="farmer-shell"><div class="farmer-head"><div><h2 style="margin:0">${t('bookSlotTitle')}</h2><div class="muted">${t('feeApplies')}</div></div><button class="btn" onclick="state.screen='farmer';render()">${t('back')}</button></div><div class="stepbar"><div class="step on"></div><div class="step ${state.selectedSlot?'on':''}"></div><div class="step"></div></div>${!state.selectedSlot?slotPicker():paymentView()}</div>`)}
function slotPicker(){const crops=[['Paddy','Paddy'],['Wheat','Wheat'],['Maize','Maize'],['Cotton','Cotton']];return `<div class="card"><div class="formgrid"><div class="field"><label>${t('procurementCentre')}</label><select onchange="state.selectedCentre=this.value;loadSlots().then(render)">${state.centres.map(c=>`<option value="${c.id}" ${c.id===state.selectedCentre?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>${t('date')}</label><input type="date" value="${state.selectedDate}" min="${new Date().toISOString().slice(0,10)}" onchange="state.selectedDate=this.value;loadSlots().then(render)"></div><div class="field"><label>${t('crop')}</label><select onchange="state.crop=this.value;currentRate().then(r=>{state.currentRate=r;render()})">${crops.map(([v,label])=>`<option value="${v}" ${state.crop===v?'selected':''}>${esc((I18N[state.language]||I18N.en).crops?.[v]||label)}</option>`).join('')}</select></div><div class="field"><label>${t('quantity')}</label><input type="number" min="1" value="${state.qty}" onchange="state.qty=Number(this.value)"></div></div><div class="rate-box"><div class="muted">${t('govRate')} ${esc(farmerCrop(state.crop))} ${state.language==='te'?'కు ':state.language==='hi'?'के लिए ':'on '}${esc(state.selectedDate)}</div><div class="rate-big">${state.currentRate?money(state.currentRate.rate_per_quintal)+' '+t('perQuintal'):t('rateNotSet')}</div><div class="formula">${t('estimatedValue')}</div></div><h3 style="margin-top:22px">${t('availableSlots')}</h3><div class="slot-grid">${state.slots.map(s=>`<button class="slot-btn ${s.status!=='open'||s.remaining<=0?'closed':''}" ${s.status!=='open'||s.remaining<=0?'disabled':''} onclick="selectSlot('${s.id}')"><b>${s.start_time} – ${s.end_time}</b><div class="meta">${s.remaining} ${t('remaining')} ${s.delay_minutes?`· +${s.delay_minutes} ${t('minutes')} ${t('delayWord')}`:''}</div></button>`).join('')||`<div class="empty">${t('noSlots')}</div>`}</div><div class="payment"><b>${t('bookingFee')}</b><div class="payment-row"><span class="muted">${t('payAfter')}</span><span class="price">₹20</span></div></div></div>`}
async function selectSlot(id){state.selectedSlot=state.slots.find(s=>s.id===id);render()}
function paymentView(){const s=state.selectedSlot;return `<div class="card"><h3>${t('reviewPayment')}</h3><div class="detailgrid"><div class="kv"><small>${t('centre')}</small><b>${esc(state.centres.find(c=>c.id===state.selectedCentre)?.name)}</b></div><div class="kv"><small>${t('date')}</small><b>${state.selectedDate}</b></div><div class="kv"><small>${t('time')}</small><b>${s.start_time} – ${s.end_time}</b></div><div class="kv"><small>${t('cropQty')}</small><b>${esc(state.crop)} / ${state.qty} qtl</b></div></div><div class="payment"><div class="payment-row"><div><b>₹20 ${t('bookingFee')}</b><div class="meta">${t('demoPayment')}</div></div><div class="price">₹20</div></div><div class="field" style="margin-top:12px"><label>${t('paymentMethod')}</label><select onchange="state.paymentMethod=this.value"><option>UPI</option><option>Card</option><option>Cash</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn" onclick="state.selectedSlot=null;render()">${t('back')}</button><button class="btn primary" onclick="payAndBook()">${t('payConfirm')}</button></div></div>`}
async function payAndBook(){try{const b=await api("/bookings",{method:"POST",body:JSON.stringify({centre_id:state.selectedCentre,slot_id:state.selectedSlot.id,booking_date:state.selectedDate,crop:state.crop,declared_quantity:state.qty})});await api("/payments/advance",{method:"POST",body:JSON.stringify({booking_id:b.id,amount:20,method:state.paymentMethod})});await loadBookings();state.screen="farmer";render();toast("₹20 paid — slot confirmed")}catch(e){toast(e.message);await loadSlots();render()}}
function languageView(){return `<div class="login"><div class="loginbox"><div class="brand">🌾 KisanDwaar</div><h2>Choose your language</h2><p class="muted">Select your preferred language before entering your dashboard.</p><div class="rolegrid" style="grid-template-columns:1fr"><button class="role ${state.language==="en"?"selected":""}" onclick="state.language='en';render()"><b>English</b><br><span class="muted">Continue in English</span></button><button class="role ${state.language==="te"?"selected":""}" onclick="state.language='te';render()"><b>తెలుగు</b><br><span class="muted">తెలుగులో కొనసాగండి</span></button><button class="role ${state.language==="hi"?"selected":""}" onclick="state.language='hi';render()"><b>हिंदी</b><br><span class="muted">हिंदी में जारी रखें</span></button></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="continueLanguage()">Continue to Farmer Dashboard</button></div></div>`}
async function continueLanguage(){
  const btn=document.querySelector('.loginbox .btn.primary');
  if(btn){btn.disabled=true;btn.textContent="Loading dashboard…";}
  localStorage.setItem("kd_language",state.language);
  try{await api("/me",{method:"PATCH",body:JSON.stringify({language:state.language})});}
  catch(e){console.warn("Language preference could not be saved:",e.message);}
  try{await loadRole();}
  catch(e){console.error(e); if(btn){btn.disabled=false;btn.textContent=`Continue to Farmer Dashboard`;} toast(e.message||"Unable to load dashboard");}
}
function render(){const r=$("#root");if(state.screen==="login")r.innerHTML=loginView();else if(state.screen==="register")r.innerHTML=registerView();else if(state.screen==="language")r.innerHTML=languageView();else r.innerHTML=state.screen==="book"?bookingView():farmerHome()}
init();
</script>
